name: Bug Report
description: Report a bug or unexpected behavior in the documentation.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: "When I run the service with the default configuration, it exits with an error."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps needed to reproduce the behavior.
      placeholder: |
        1. Install the project
        2. Start the service
        3. Send a request to the affected endpoint
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include the full traceback if applicable.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Page or Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "e.g. 3.12.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Ubuntu 24.04, macOS 15.2"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Configuration
      description: Paste any relevant log output or configuration (redact credentials).
      render: text
    validations:
      required: false
